<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — ClearPath Insurance</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<style>
  :root {
    --text: #4b4553;
    --text-h: #08060d;
    --bg: #fff;
    --border: #e5e4e7;
    --accent: #aa3bff;
    --code-bg: #f4f3ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #9ca3af;
      --text-h: #f3f4f6;
      --bg: #16171d;
      --border: #2e303a;
      --accent: #c084fc;
      --code-bg: #1f2028;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 18px/1.6 system-ui, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .wrap {
    max-width: 440px;
    padding: 2rem;
    text-align: center;
  }
  .brand {
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    font-size: 1.05rem;
    margin-bottom: 2.5rem;
  }
  .code {
    font-size: 4.5rem;
    font-weight: 800;
    color: var(--text-h);
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 0.75rem;
  }
  h1 {
    color: var(--text-h);
    font-size: 1.3rem;
    margin: 0 0 1rem;
  }
  p {
    color: var(--text);
    margin: 0 0 2rem;
    font-size: 0.95rem;
  }
  button {
    font: inherit;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text-h);
    cursor: pointer;
  }
  .hint {
    font-size: 0.78rem;
    color: var(--text);
    margin-top: 0.7rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">✓ ClearPath Insurance</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>There are no job openings at ClearPath Insurance at this time.<br />There never have been.</p>
    <button type="button" onclick="window.close()">Close this tab</button>
    <div class="hint">(If that doesn't do anything — most browsers won't let a page close a tab it didn't open itself — just press Ctrl/Cmd+W.)</div>
  </div>
</body>
</html>
